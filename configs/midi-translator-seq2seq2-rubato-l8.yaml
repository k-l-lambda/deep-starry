# MidiTranslator over the FULL piano0909 corpus, 8 layers: notated -> performance (re-humanization).
#
# SIBLING OF configs/midi-translator-seq2seq2-rubato-l16.yaml, which differs ONLY in `n_layer` (16 vs 8)
# and in the two fields that had to be re-measured at this depth (`batch_size`'s table below — the
# CHOSEN VALUE is the same 12 — and the epoch-time column under `epoch_size`). Every other field is
# byte-identical, deliberately, so a curve comparison between the two isolates depth.
#
# READ THE l16 CONFIG for the corpus-level reasoning, which is identical here and is not duplicated in
# full: why `mark_mode` must be `measure` (piano0909 has no @tick lines, and `tick` degrades silently to
# whole-file crops), why `line_range` is [120, 256] rather than the reference run's [360, 512] (measured
# tail-rate collapse to 0.639 at that window), why `p_tail` does not realize at 0.15 (an incidental tail
# is a geometric property, not the roll's outcome), what `max_tokens` guards, the `start_jitter` defect
# carried over from the reference run, and what `transposition_sigma` does to both halves. Those are
# properties of the data and the feeder, not of depth.
#
# DIRECTION WARNING, in short (the l16 header has it in full): the corpus was made by translating
# rubato -> regular with 20260909-midi-translator-nota1m0909-lines360-l16d256, so this config trains the
# INVERSE — the source arm is synthetic (that model's output) and the target arm is real performance
# MIDI. The pairing is bar-aligned by construction but it is not a clean supervised corpus, and each
# pair covers only ~0.09-0.15 of its source file. Do not read a low loss here as "performance rendering
# works".
#
# WHY AN 8-LAYER RUN AT ALL: 8.69M params against l16's 17.08M, and MEASURED ~2.1x the training
# throughput at the same batch size (54.8 vs 26.1 samples/s), so it reaches any given sample count in
# under half the wall time. On a corpus whose real limitation is coverage rather than capacity (see the
# l16 header), the useful question is whether the extra depth buys anything at all — which is what
# running both answers.

id:     midi/{date}-{filename}


imports:
  - starry.midi.data.seq2seq2
  - starry.midi.models.midiTranslator


# Copies assets/midiseq2Vocab.yaml into the run directory, so the ids a checkpoint's embedding rows
# stand for travel with the checkpoint. The builder injects vocab_size (582) and eos_id (2) into the
# model args, so they are not restated below.
assets:
  - type: Midiseq2Vocab


data:
  type:                     Seq2Seq2
  # PACKED, SINGLE-ARCHIVE layout: <root>/piano0909.zip + <root>/index.json, built by
  #   python3 tools/midi/packMidiseq2Shards.py --root <loose piano0909> \
  #     --arms regular rubato --out <DATA_DIR>/piano0909-packed --single piano0909
  #
  # Auto-detected via `index.json`, whose `shard_chars: 0` tells the feeder to route every read to the
  # single archive rather than deriving one from the sample's name. In packed mode `source_dir`/
  # `target_dir` are ENTRY PREFIXES baked into the archive, not directories — renaming an arm means
  # repacking.
  root:                     piano0909-packed
  # cycle 20, phase 19 -> 95% train / 5% val; at ~14,200 published pairs that is ~13,490 / ~710. VERIFY
  # against `index.json`'s `samples` after packing rather than trusting the arithmetic — the filter is
  # positional over the manifest's name list.
  splits:                   '*0..18/20:19/20'
  # MEASURED on this workstation's RTX 3090 (24 GB, otherwise idle), fp32 (no autocast — see the trainer
  # block), real feeder inside the timed region, at THIS config's crop policy, 6 steps after 3 warmup,
  # n_layer 8:
  #
  #   bs    alloc   reserved   card    step   samples/s   T max
  #    8    3.11G      4.64G    19%   192ms        41.7    1460
  #   12    4.30G      7.16G    30%   219ms        54.8    1393   <- chosen
  #   16    7.25G      7.93G    33%   317ms        50.5    1716
  #   20    7.17G     10.64G    44%   377ms        53.1    1404
  #   24   10.51G     16.14G    67%   450ms        53.4    1678
  #
  # And the worst case, synthetic batches padded to a FIXED T = 2048 (the cap), which the feeder never
  # reached on its own (T max 1,716):
  #
  #   bs 12  T 2048   alloc  5.23G   reserved  5.54G (23%)   step 360ms
  #   bs 16  T 2048   alloc  6.93G   reserved  7.31G (30%)   step 487ms
  #   bs 20  T 2048   alloc  8.62G   reserved  9.09G (38%)   step 603ms
  #   bs 24  T 2048   alloc 10.32G   reserved 10.89G (45%)   step 720ms
  #
  # THIS DEPTH IS NOT MEMORY-BOUND — bs 24 sits at 67% real / 45% worst-case, and unlike l16 (which
  # reserves 97% at bs 16) there is no ceiling in this range. bs 12 is chosen anyway, for two reasons:
  # throughput is FLAT above it (50.5-54.8 samples/s at bs 12-24, and 54.8 at bs 12 is already the
  # highest row), so a larger batch buys nothing; and holding bs equal to the l16 sibling's makes depth
  # the only difference between the two runs. If you ever want a larger batch here, note that it would
  # have to be justified against that comparability, not against memory.
  #
  # One measurement artifact worth not misreading: bs 16's `alloc` (7.25G) exceeds bs 20's (7.17G). T
  # differs every batch, so a row's peak depends on which crops it drew — bs 16 happened to draw the
  # longest batch in the sweep (T 1,716). Compare the fixed-T table for a clean shape-vs-shape reading.
  batch_size:               12
  args:
    # Direction: notated -> performance. `regular` is the SYNTHETIC arm (see the header). In packed mode
    # these are entry prefixes inside piano0909.zip, not directories.
    source_dir:             regular
    target_dir:             rubato
    # MANDATORY: piano0909 carries no @tick lines, so `tick` mode finds zero marks and every crop
    # becomes the whole file — silently, taking line_range, p_head, p_tail, start_jitter and max_tokens
    # down with it. See the l16 config for the measurement (T max 45,040, an immediate OOM).
    mark_mode:              measure
    # MEASURED: the reference run's [360, 512] collapses the crop modes on this corpus (realized tail
    # rate 0.639), because these files are 105-8,822 lines with a median of 877. [120, 256] gives
    # head 0.180 / tail 0.273, T median 783 and max 1,716 over 800 crops. Full table in the l16 config.
    line_range:             [120, 256]
    # p_tail cannot realize at 0.15 here: an incidental tail (a middle crop that grew to EOF) counts as
    # `tail` geometrically, and on the trimmed files the roll contributes exactly +0.000. See l16.
    p_head:                 0.15
    p_tail:                 0.15
    # Source half carries no <eom>: it is a plain content-token stream. Target always does.
    source_eom:             false
    # Cap on the ASSEMBLED sequence, enforced by RESAMPLING — truncating would cut a boundary off its
    # mark and destroy the alignment this feeder exists to provide. Slack at this line_range on purpose:
    # it guards the long tail of an 8,822-line file rather than shaping the distribution.
    max_tokens:             2048
    resample_tries:         8
    # source <= -2 down its own file axis, <sep> = -1, target >= 0 up its own. One arithmetic run, so
    # RoPE sees it as identical to 'flat'; it buys readability, not behaviour.
    pos_style:              sep
    # Std dev IN LINES on the source crop's start, closing the train/inference mismatch (crops start on
    # a mark line; a production sliding window starts mid-measure). Carries the reference run's known
    # line-vs-token defect knowingly — see the l16 config.
    start_jitter:           2
    # Random transposition in semitones, round(gauss(0, sigma)) per sample, applied to BOTH halves —
    # every note_on/note_off pitch plus key_signature around the circle of fifths, folding by +/-12 at
    # the vocabulary's range edge.
    #
    # WHETHER THE OFFSET IS FIXED PER SAMPLE FOLLOWS `random_crop`, which follows `shuffle`: on this
    # shuffled train segment it is redrawn every epoch (augmentation working); on a segment with
    # random_crop False each sample keeps one permanent offset (reproducible, but a one-time relabeling).
    # So setting random_crop False on a TRAIN split silently turns this off as augmentation.
    transposition_sigma:    2
  args_variant:
    # Val takes a deterministic crop per sample, so the metric moves only when the model does. Per the
    # note above this also fixes each val sample's transposition offset — val measures transposed keys
    # reproducibly. Set `transposition_sigma: 0` here if you would rather val stay in the original key;
    # the trade is that val then never sees a transposed key while train mostly does.
    1:
      random_crop:          false


model:
  # 8.69M params (8 x 256, head_dim 64, d_inner = 4 * d_model = 1024). Half the l16 sibling's depth and
  # the ONLY field that differs between the two configs' model blocks. Measured counts at d_model 256,
  # llama backbone, untied embedding: n_layer 4 = 4.49M, 8 = 8.69M, 16 = 17.08M.
  type:                     MidiTranslator
  args:
    # vocab_size (582) and eos_id (2) come from the pinned midiseq2Vocab.yaml via `assets:` above; a
    # value here disagreeing with the pinned file raises at creation rather than being used silently.
    backbone:               llama
    d_model:                256
    n_layer:                8
    n_head:                 4
    d_inner:                ~
    num_key_value_heads:    ~
    max_seq_len:            4096
    dropout:                0.1
    tie_embedding:          false


trainer:
  device:                   cuda
  # SINGULAR — train.py (starry/utils/trainer.py), not trainDist.py, because the memory table above was
  # measured on this workstation's single 3090. To port to trainDist: rename this to `epochs` (plural)
  # or it KeyErrors, and add back `val_batch_size` / `epoch_duration`. Two consequences that the numbers
  # above depend on: NO AUTOCAST (so `dtype: bfloat16` is absent and every figure is fp32), and
  # validation runs IN-LINE at the end of each epoch.
  epoch:                    1000
  # HELD IDENTICAL to the l16 sibling so both runs advance the same number of samples per epoch and
  # their curves line up on either axis. 1,100 steps at bs 12 -> ~0.98 of one pass over the ~13,490-pair
  # train split. MEASURED at this depth's step time (219 ms):
  #
  #   epoch_size   steps   min/epoch (l8)   passes over train   val pass   val overhead
  #        6,600     550              2.0                0.49       7.1s           5.9%
  #       13,200    1100              4.0                0.98       7.1s           2.9%   <- chosen
  #       26,400    2200              8.0                1.96       7.1s           1.5%
  #
  # The val pass is MEASURED, not estimated: forward-only at bs 12, no_grad, 119 ms/step at n_layer 8
  # (100.5 samples/s), so ~710 samples is 7.1 s. At 2.9% of an epoch it does not gate the cadence.
  #
  # Note this epoch is 4.0 min against l16's 8.4 min — same samples, ~2.1x the throughput. So the l8 run
  # finishes any given sample count in under half the wall time, which is the practical reason to run it.
  epoch_size:               13200
  # x-axis in cumulative samples, so curves stay comparable across epoch_size / batch_size changes and
  # between this config and its l16 sibling.
  report_step_unit:         examples
  save_mode:                best
  moniter:
    field:                  loss
    mode:                   min


optim:
  # No `lr` here on purpose: the scheduler sets param_group['lr'] every step, so an `lr` in args would
  # be silently overwritten.
  type:                     AdamW
  args:
    betas:                  [0.9, 0.98]
    eps:                    1.e-9
    weight_decay:           0.01
  scheduler:
    type:                   InvSqrt
    args:
      lr_mul:               0.1
      # Peak lr = lr_mul * d_model^-0.5 * n_warmup^-0.5 = 1.40e-4, the reference run's value, and here
      # 2,000 steps at bs 12 is ~1.8 passes over the train split — sensible by the reference's own rule,
      # unlike on the 85-pair shakedown corpus where the same value was ~415 passes.
      #
      # NOTE it is the same peak lr as the l16 sibling, which is what keeping d_model equal buys: the
      # two runs differ in depth alone, not in schedule.
      n_warmup_steps:       2000
      # Overwritten from model.args.d_model by _copy_fileds below, so it cannot drift from the model.
      # A stale 512 here would give 9.9e-5 instead of 1.40e-4, 29% low, with nothing raised.
      d_model:              256


# Derived fields, applied before the model is built. The InvSqrt peak lr is
# lr_mul * d_model^-0.5 * n_warmup^-0.5, so the scheduler's d_model must be the model's or the whole lr
# schedule is wrong by a factor of sqrt(ratio) with no error raised.
_copy_fileds:
- [optim.scheduler.args.d_model, model.args.d_model]
