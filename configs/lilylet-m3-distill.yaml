# ABC -> Lilylet M3 distillation.
#
# Trains a Lilylet symbolic encoder (LilyletM3Encoder) to match the frozen CLaMP 3
# ABC M3 encoder's mean-pooled [768] embedding, via cosine regression.
#
# Data: the lilylet-m3-abc-pooled artifact from tools/lilylet/preprocessLilyletM3.py.
# The dataset root is os.path.join($DATA_DIR, data.root); note .env.local sets
# DATA_DIR (override=True) so an inline DATA_DIR= is ignored. We give data.root as an
# ABSOLUTE path, which os.path.join uses verbatim regardless of DATA_DIR.
#
#   python train.py configs/lilylet-m3-distill.yaml
#
# This 215-sample artifact is for a SMOKE TEST only; real training needs a much
# larger abc2lilylet-generated corpus (the teacher produces targets for free).
#
# NOTE on max_patches truncation: the teacher target was pooled over the WHOLE ABC
# piece, but a truncated Lilylet input only covers a window — a mild train/target
# mismatch for the few over-cap pieces (3/215 exceed 2048). Acceptable as CLaMP-style
# length capping; if exactness matters, regenerate targets from the same window.

id: lilylet-m3-distill/{date}-{filename}

env: ~

data:
  type:                     LilyletM3Distill
  root:                     /home/camus/data/lilylet/m3/notagenx-from-abc.pt
  splits:                   '*0..8/10:9/10'      # '*' shuffles the train split; mod-10 phases 0-7 train, 9 val
  batch_size:               4
  args_variant:
    1:
      random_truncate: false   # val: deterministic head cut (reproducible)
  args:
    pad_id:                 0
    max_patches:            2048   # cap Lilylet patch length; over-long → CLaMP-style window
    random_truncate: ~             # default: follows split shuffle (train random, val head)

model:
  type:                     LilyletM3Encoder     # 'Loss' suffix is appended at train time
  args:
    num_classes:            256                  # Lilylet manual tokenizer vocab (teacher ABC uses 128)
    hidden_size:            768                  # must match the teacher M3 embedding dim
    patch_size:             64                   # M3 patch size
    patch_length:           512                  # position-embedding cap (M3)
    patch_num_layers:       12
    n_head:                 12
    project:                true                 # final Linear(768,768) head
    # warm_start from the ABC teacher needs matching num_classes (128); Lilylet is 256,
    # so we train the patch-embedding from scratch (encoder body is still same arch).
    warm_start:             false

trainer:
  env: ~
  device:                   cuda
  save_mode:                best
  epoch:                    50
  report_step_unit:         epoch
  moniter:
    field:                  loss
    mode:                   min

optim:
  type:                     AdamW
  args:
    betas:                  [0.9, 0.98]
    eps:                    1.e-9
    weight_decay:           0.01
  scheduler:
    type:                   InvSqrt
    args:
      lr_mul:               1
      n_warmup_steps:       200
      d_model:              768
