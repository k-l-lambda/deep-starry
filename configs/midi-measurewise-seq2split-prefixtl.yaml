# Conditioned-MIDI MEASUREWISE (midiseq2 SPLIT-MODALITY) — lyl-conditioning IN THE TOKEN LEVEL.
#
# Committed template (small test corpus) for the MidiSeq2PrefixInTokenLevel model. The split-modality
# dataset keeps the two modalities in SEPARATE tensors at their native widths / vocabularies:
#   lyl_patches [Lp,16] (lyl vocab 256)   +   midi_patches [Mp,64] (midiseq2 vocab 838)
# — no 16->64 widening, no shared integer axis, no clamp.
#
# Pipeline to produce the artifact this config consumes:
#   1. intelli-piano: midi-txt/*.txt --tools/midiTxtToSeq2.ts--> midi-seq2/*.midiseq2.txt  (basic -> midiseq2)
#   2. deep-starry:   tools/midi/buildCondMidiseq2MeasurewiseSplit.py --dataset dataset.yaml
#                     -> cond-midiseq2-split.lmmw.pt  (starry.midi.data.seq2CondSplitPachifier.pack_split)
#
# Feeder: starry.midi.data.seq2CondSplitPatchy.Seq2CondSplitMidiPatchy — emits per-modality tensors +
# measure ids + a midi->midi window mask (midi_attn_mask, the midi block of build_vis). The midi->lyl
# CROSS coupling is NOT a mask: the model gathers the lyl prefix from measure ids (w_cross, default 1).
#
# Model: MidiSeq2PrefixInTokenLevel — a MIDI-only self-attention decoder + per-target lyl-cross-window
# prefix in a PrefixTokenLevelDecoder (lyl re-embedded raw at negative, increasing positions). No lyl
# encoder (the pretrained LilyletNotaGen tower is not used by this variant).
#
# Test corpus: test20260629 (215 paired lilylet/midi samples).

id:     midi/{date}-{filename}


imports:
  - starry.midi.models.midiSeq2PrefixInTokenLevel
  - starry.midi.data.seq2CondSplitPatchy


data:
  type:                     Seq2CondSplitMidiPatchy
  root:                     lilylet/midi-measurewise/test20260629/cond-midiseq2-split.lmmw.pt
  # 215 samples, single shard. cycle 20, phase 19 -> ~10 val / ~205 train.
  splits:                   '*0..18/20:19/20'
  batch_size:               1
  args_variant: ~
  args:
    # patch_size / lyl_patch_size are baked into the artifact; the feeder reads them from the index.
    w_midi:                 2          # midi->midi attention window, in MEASURES
    w_cross:                1          # midi->lilylet cross window (MEASURES); feeder mask ignores it,
                                       # the model uses it to gather the lyl prefix (see model.args.w_cross)
    patch_length:           0          # unsupported here (measure coupling); use max_patches
    max_patches:            0          # 0 = no crop (small corpus); bound Mp for large corpora

model:
  type:                     MidiSeq2PrefixInTokenLevel
  args:
    w_cross:                1          # lyl cross window (MEASURES) for the per-target token-level prefix
    lyl_vocab_size:         256
    midi_vocab_size:        838        # midiseq2 vocab (assets/midiseq2Vocab.yaml)
    patch_size:             64         # midiseq2 measure-patch width (midi side)
    lyl_patch_size:         16         # lilylet patch width (native; raw-embedded as prefix)
    lyl_patch_length:       1024       # token/decoder max_position_embeddings (covers Kmax+P+1 & neg positions)
    # --- midi self-attention decoder + token head ---
    d_model:                768
    n_dec_layer:            6
    token_num_layers:       3
    n_head:                 12
    dec_num_key_value_heads: 12
    num_key_value_heads:    12
    d_inner:                3072
    dropout:                0.1


trainer:
  env: ~
  device:                   cuda
  save_mode:                best
  epochs:                   10000
  epoch_size:               205        # placeholder: ~one pass over train; measure & balance
  report_step_unit:         examples
  epoch_duration:           30
  moniter:
    field:                  loss
    mode:                   min
  dtype:                    bf16

optim:
  type:                     Adam
  args:
    betas:                  [0.9, 0.98]
    eps:                    1.e-9
  scheduler:
    type:                   InvSqrt
    args:
      lr_mul:               0.2
      n_warmup_steps:       1000
      d_model:              768
