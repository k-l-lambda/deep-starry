# Conditioned-MIDI bGPT — generate MIDI conditioned on a lilylet score, measure-coupled.
# Joint sequence per song: [lilylet score patches] ++ [midi event patches], with a custom
# windowed/block attention mask (CondMidiPatchy) coupling midi measures to lilylet measures.
# Dual patch-embedding (lilylet vocab 256 / midi vocab 41) + shared llama backbone; only the
# midi segment is supervised (single midi token-level head).
#
# NOTE: batch_size / patch_length / epoch_size below are PLACEHOLDERS. The corpus has max
# T≈67.8k patches (mean ≈8.5k) and is NOT cropped (per-song measure coupling forbids it), so
# the long songs dominate memory — measure on the target GPU before a long run
# (tune-train-config skill: measure-first). val≈11 samples (215 × 5%) is tiny → noisy val.

id:     midi/{date}-{filename}


imports:
  - starry.midi.models.condBgpt
  - starry.midi.data.condPatchy


data:
  type:                     CondMidiPatchy
  root:                     lilylet/midi-measurewise/test20260629/cond-midi.lmmw.pt
  # 215 samples, single shard. cycle 20, phase 19 -> ~11 val / ~204 train.
  splits:                   '*0..18/20:19/20'
  batch_size:               1
  args_variant: ~
  args:
    patch_size:             16
    patch_length:           0          # 0 = no crop (measure coupling must stay intact)
    w_midi:                 2          # midi->midi attention window, in MEASURES
    w_cross:                2          # midi->lilylet cross window, in MEASURES


model:
  type:                     CondMidiBGPT
  args:
    base_type:              llama
    lyl_vocab_size:         256
    midi_vocab_size:        41
    patch_size:             16
    patch_length:           70000      # >= max T over the corpus (67769); RoPE bound
    hidden_size:            768
    patch_num_layers:       12
    token_num_layers:       3
    n_head:                 12
    num_key_value_heads:    12
    intermediate_size:      3072


trainer:
  env: ~
  device:                   cuda
  save_mode:                best
  epochs:                   10000
  epoch_size:               204        # placeholder: ~one pass over train; measure & balance
  report_step_unit:         examples
  epoch_duration:           30
  moniter:
    field:                  loss
    mode:                   min
  dtype:                    bf16

optim:
  type:                     Adam
  args:
    betas:                  [0.9, 0.98]
    eps:                    1.e-9
  scheduler:
    type:                   InvSqrt
    args:
      lr_mul:               0.2
      n_warmup_steps:       1000
      d_model:              768
