# MidiTranslator over the FULL piano0909 corpus, 16 layers: a decoder-only stack that reads a NOTATED
# rendering and writes the PERFORMANCE behind it. Performance rendering (re-humanization), the INVERSE
# of every transcription config in this directory.
#
# This is the full-corpus successor to configs/midi-translator-seq2seq2-rubato.yaml, which is a
# SHAKEDOWN on an 85-pair sample. What carries over unchanged from that config is everything justified
# by the corpus's file-length distribution (mark_mode, line_range, p_head/p_tail, max_tokens); what is
# re-measured here is everything that depends on model depth or corpus size (batch_size, epoch_size,
# splits). Its l8 sibling is configs/midi-translator-seq2seq2-rubato-l8.yaml and differs ONLY in
# n_layer, so a curve comparison between the two isolates depth.
#
# ONE CORRECTION TO THE SHAKEDOWN CONFIG, worth stating because it invalidates its own header claim:
# that file says "Held IDENTICAL to 20260909-...-l16d256. 17.08M params (deep-and-narrow: 16 x 256)"
# while setting `n_layer: 4`. MEASURED param counts at d_model 256, llama backbone, untied embedding:
# n_layer 4 = 4.49M, 8 = 8.69M, 16 = 17.08M. So 17.08M is the 16-layer figure and the shakedown was
# NOT running the reference depth. THIS config is the one that matches it.
#
# READ THIS BEFORE READING A CURVE — the direction is inverted with respect to how the corpus was made.
# translate_piano0909.sh produced the two arms by translating rubato -> regular with
# 20260909-midi-translator-nota1m0909-lines360-l16d256:
#     rubato/<id>.midiseq2.txt    the REAL performance MIDI (+ @measure annotation)  <- ground truth
#     regular/<id>.midiseq2.txt   the notated arm the model WROTE                    <- model output
# So this config trains regular -> rubato: the SOURCE is synthetic (a model's output, carrying whatever
# that model got wrong) and the TARGET is real data. The pairing is aligned bar-for-bar by construction,
# but it is NOT a clean supervised corpus — an error in the reference checkpoint is a permanent feature
# of this run's input distribution. Do not read a low loss here as "performance rendering works"; read
# it as "rubato is recoverable from THIS regular arm".
#
# COVERAGE, the corpus's real limitation: each pair covers only ~0.09-0.15 of its source file, and the
# publish gate certifies >= 4 surviving measures, NOT that a result read its source. See
# .work/coverage.tsv on 196_2 for the honest per-file number. A pair is well-formed and bar-aligned;
# it is not a whole piece.

id:     midi/{date}-{filename}


imports:
  - starry.midi.data.seq2seq2
  - starry.midi.models.midiTranslator


# Copies assets/midiseq2Vocab.yaml into the run directory, so the ids a checkpoint's embedding rows
# stand for travel with the checkpoint. The builder injects vocab_size (582) and eos_id (2) into the
# model args, so they are not restated below.
assets:
  - type: Midiseq2Vocab


data:
  type:                     Seq2Seq2
  # PACKED, SINGLE-ARCHIVE layout: <root>/piano0909.zip + <root>/index.json, built by
  #   python3 tools/midi/packMidiseq2Shards.py --root <loose piano0909> \
  #     --arms regular rubato --out <DATA_DIR>/piano0909-packed --single piano0909
  #
  # Auto-detected — `index.json` is present, so `packed` stays unset. The manifest records
  # `shard_chars: 0`, which is what tells the feeder to route every read to the one archive instead of
  # deriving an archive name from the sample's own name (nota1m's 223-shard corpus records 2 and is
  # unaffected). One archive rather than shards because sharding buys a small per-archive central
  # directory and a bounded fd count, and at ~14k samples neither binds.
  #
  # NOTE the consequence for the two arm names below: in packed mode `source_dir`/`target_dir` are
  # ENTRY PREFIXES baked into every archive entry, not directories. Renaming an arm after the fact
  # means repacking; a `mv` on a loose corpus has no equivalent here.
  root:                     piano0909-packed
  # cycle 20, phase 19 -> 95% train / 5% val. At the corpus's expected ~14,200 published pairs that is
  # ~13,490 train and ~710 val.
  #
  # VERIFY AFTER PACKING rather than trusting that arithmetic: the filter is POSITIONAL
  # (`i % cycle in phases`) over the manifest's name list, so the exact counts follow the final sample
  # count. `index.json`'s `samples` field is the number to check against.
  #
  # 5% is chosen over the shakedown's 10% because the absolute size is what matters for a stable metric,
  # not the fraction: ~710 samples is a real val set (the shakedown's was EIGHT, a smoke check whose
  # val_loss was not comparable across runs), and a bigger val slice would only spend train data and
  # lengthen the val pass for no gain in stability.
  splits:                   '*0..18/20:19/20'
  # MEASURED on this workstation's RTX 3090 (24 GB, otherwise idle), fp32 (the single-process trainer
  # has NO autocast — see the trainer block), real feeder inside the timed region, at THIS config's crop
  # policy (line_range [120,256], max_tokens 2048), 6 steps after 3 warmup, n_layer 16:
  #
  #   bs    alloc   reserved   card     step   samples/s   T max
  #    8    5.39G      7.32G    31%    281ms        28.4    1608
  #   12   10.41G     11.04G    46%    460ms        26.1    1666   <- chosen
  #   16   13.02G     23.18G    97%    576ms        27.8    1594
  #   20   14.83G     23.07G    96%    837ms        23.9    1474
  #   24   16.30G     22.98G    96%    848ms        28.3    1373
  #
  # bs 12 is chosen because THROUGHPUT IS FLAT (23.9-28.4 samples/s across the whole range), so a larger
  # batch buys no speed and only spends headroom — and bs 16 already reserves 97% of the card. The
  # shakedown config records a 3090 dying at 63% ALLOCATED because reservations had filled 98%; 97% is
  # that same position.
  #
  # THE WORST-CASE PROBE COMES OUT LOWER THAN THE REAL FEEDER, which inverts the usual expectation and
  # is the reason bs 16 is refused. Synthetic batches padded to a FIXED T = 2048 (the cap), same model
  # and optimizer:
  #
  #   bs 12  T 2048   alloc 10.24G   reserved 10.58G (44%)   step  715ms
  #   bs 16  T 2048   alloc 13.56G   reserved 13.97G (58%)   step  978ms
  #   bs 20  T 2048   alloc 16.88G   reserved 17.38G (72%)   step 1214ms
  #   bs 24  T 2048   alloc 20.20G   reserved 20.80G (87%)   step 1485ms
  #
  # So at bs 16 the SHAPE demands 13.97G but the real feeder reserves 23.18G. The gap is fragmentation,
  # not live data: T differs every batch (the crop is a sampled line range), and blocks the allocator
  # kept for earlier shapes do not fit later ones. Read the 97% row as the operational number and the
  # 58% row as the shape's own demand. If you ever need a larger batch here, set
  # PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True before reaching for one — that is what the gap
  # responds to. Note also that no probe row reached max_tokens (T max 1,666 against a 2,048 cap), so
  # none of the feeder-real rows is a worst case.
  batch_size:               12
  args:
    # Direction: notated -> performance. See the header — this is the inverse of the corpus's own
    # generation direction, and `regular` is the synthetic arm. In packed mode these are ENTRY
    # PREFIXES inside piano0909.zip, not directories on disk.
    source_dir:             regular
    target_dir:             rubato
    # MANDATORY HERE, and not a preference. piano0909 files carry NO @tick lines (measured: 0 in every
    # file of both arms, against 5-205 @measure lines). In `tick` mode `_File` finds ZERO marks and
    # `_pick_crop` returns (0, 0) — "the only honest crop is the whole thing". That degrades SILENTLY
    # and takes five settings down with it: line_range, p_head, p_tail, start_jitter and max_tokens all
    # stop having any effect, because max_tokens is enforced by RESAMPLING and every resample returns
    # the same whole-file crop. Measured on the 85-pair sample in `tick` mode: 85 of 85 files zero
    # marks, T median 4,881 and max 45,040, with 67 of 85 over the 2,048 cap. Attention is O(T^2), so a
    # 45k row is not a slow run, it is an immediate OOM.
    mark_mode:              measure
    # MEASURED on the 85-pair sample, regular -> rubato, mark_mode measure, 800 crops per row. The full
    # corpus has the same file-length distribution, so these carry over:
    #
    #   line_range     head    tail    T med   T p95   T max   marks/crop med
    #   [360, 512]    0.139   0.639     1538    2037    2438        7
    #   [240, 420]    0.182   0.444     1386    1954    2043        7
    #   [180, 360]    0.181   0.364     1120    1758    2045        6
    #   [120, 256]    0.180   0.273      783    1284    1716        5   <- chosen
    #   [ 96, 192]    0.191   0.215      626     979    1300        4
    #
    # p_tail declares 0.15. At the reference run's [360, 512] the REALIZED tail rate is 0.639 — the crop
    # modes have collapsed and two thirds of every batch is a piece-ending. The cause is file length:
    # these files run 105-8,822 lines with a median of 877 and 27 bars (~32 lines a bar), so a 360-512
    # line window is 11-16 bars out of 27 and any interior start past halfway grows to EOF. nota1m's
    # files are long enough that the same cap left room; piano0909's are not.
    #
    # Why it matters beyond bookkeeping: most of these pairs do NOT end on `end_of_track` — they were
    # trimmed, and `close_final_measure` closed them with a bare `@measure N` that `_encode` turns into
    # an ordinary <eom>. An EOF-pinned crop on such a file teaches "a piece ends at an arbitrary bar
    # line". `_pick_crop` degrades a tail ROLL to middle on exactly those files (9d4e0b9), but that gate
    # cannot catch an INCIDENTAL tail — a middle crop that simply grew to EOF — and at [360, 512]
    # incidental is nearly all of it. Shrinking the window is what restores the distinction.
    line_range:             [120, 256]
    # Probability of a crop pinned to the start / end of the piece.
    #
    # p_tail does NOT come out at 0.15 and cannot: `tail` is a GEOMETRIC property (z >= len(marks))
    # reported by describe(), not the roll's outcome, so a middle crop that grows to EOF counts too.
    # MEASURED 0.273 at the chosen line_range, of which the roll contributes NOTHING on the trimmed
    # files — verified on one (0005949333, 19 marks): 0.257 at p_tail 0.15 and 0.257 at p_tail 0.0, so
    # all of it is incidental growth. On a file that DOES end on the terminator (003d38a173, 103 marks)
    # the roll is honoured and the rate is 0.165, i.e. p_tail as declared.
    p_head:                 0.15
    p_tail:                 0.15
    # Source half carries no <eom>: it is a plain content-token stream. Target always does.
    source_eom:             false
    # Cap on the ASSEMBLED sequence, enforced by resampling the crop — truncating would cut a boundary
    # off its mark and destroy the alignment this feeder exists to provide.
    #
    # At the chosen line_range it is slack (T max 1,716 over 800 crops), which is deliberate: it guards
    # the long tail of an 8,822-line file, it is not a shaping parameter. At [360, 512] it would have
    # been ACTIVE and still not sufficient — 2% of crops came out over 2,048 even after 8 resamples
    # (max 2,364), because a single bar can exceed the cap on its own and the feeder then keeps the
    # shortest attempt rather than truncating.
    max_tokens:             2048
    resample_tries:         8
    # RoPE convention: source <= -2 counting down its own file axis, <sep> = -1, target >= 0 counting up
    # its own file axis. 'sep' is one arithmetic run, so RoPE sees it as identical to 'flat'; it buys
    # readability, not behaviour. ('absolute' is the one that changes what the model sees.)
    pos_style:              sep
    # Std dev IN LINES of a normal offset on the source crop's start, for crops that do not begin at the
    # piece's start. Closes a train/inference mismatch: every crop here starts exactly ON a mark line,
    # but a sliding window over a production file starts mid-measure.
    #
    # KNOWN DEFECT, carried over knowingly from the reference run so the two stay comparable: the offset
    # is applied in LINES and marks sit on directive lines that `_encode` discards, so a +1 offset can
    # produce a token-IDENTICAL crop while `skip` still drops that crop's first bar from supervision. At
    # start_jitter 2 the reference measured 43% of interior crops unchanged against 76% of draws
    # reporting nonzero. Fixing it changes what start_jitter MEANS everywhere, so it is not done here.
    start_jitter:           2
    # Random transposition, in semitones, drawn as round(gauss(0, sigma)) per sample and applied to BOTH
    # halves — every note_on/note_off pitch, plus key_signature around the circle of fifths. A pitch
    # that would leave the vocabulary's range is folded by +/-12 to the nearest in-range value.
    #
    # Worth having HERE and not in the shakedown: 12 keys against ~14k pairs is the scale at which key
    # coverage is a real gap. MEASURED on the 85-pair sample, the two arms disagree badly about key —
    # `regular` carries sf -4..+5 with 31 of 85 files negative, while `rubato` declares a key signature
    # in only 9 files and none of them negative. sigma 2 keeps most draws inside +/-4 semitones.
    #
    # READ THIS BEFORE CHANGING random_crop: whether the offset is FIXED PER SAMPLE follows
    # `random_crop`, which follows `shuffle`. On this train segment (shuffled -> random_crop True) the
    # draw comes from the global rng and varies every epoch, which is the augmentation working. On a
    # segment with random_crop False it comes from a per-index stream and each sample keeps ONE
    # permanent offset — reproducible, but a one-time relabeling rather than augmentation. So setting
    # random_crop False on a TRAIN split silently turns this off as augmentation. The val segment below
    # is deliberately in that mode.
    transposition_sigma:    2
  args_variant:
    # Val takes a deterministic crop per sample — still a mix of head/tail/middle, but the same one
    # every epoch, so the metric moves only when the model does. Per the note above this also fixes each
    # val sample's transposition offset, so val measures the model on transposed keys reproducibly
    # rather than only on the original key. If you would rather val stay in the original key, set
    # `transposition_sigma: 0` here — the trade is that val then never sees a transposed key while train
    # mostly does.
    1:
      random_crop:          false


model:
  # 17.08M params — the reference run's depth (16 x 256, head_dim 64, d_inner = 4 * d_model = 1024).
  # Nothing here is tuned for this corpus, which is the point: a curve is attributable to the data and
  # the direction rather than to the architecture. The l8 sibling differs ONLY in n_layer.
  type:                     MidiTranslator
  args:
    # vocab_size (582) and eos_id (2) come from the pinned midiseq2Vocab.yaml via `assets:` above; a
    # value here disagreeing with the pinned file raises at creation rather than being used silently.
    backbone:               llama
    d_model:                256
    n_layer:                16
    n_head:                 4
    d_inner:                ~
    num_key_value_heads:    ~
    # Rotary position budget. 4096 covers max_tokens 2048 with room to spare; max_tokens is the real
    # guard, since a longer T OOMs before it runs out of positions.
    max_seq_len:            4096
    dropout:                0.1
    tie_embedding:          false


trainer:
  device:                   cuda
  # SINGULAR — this is train.py (starry/utils/trainer.py), NOT trainDist.py, because the memory table
  # above was measured on this workstation's single 3090. trainerQuantitative runs PROC_COUNT=2 (rank 0
  # trains, rank 1 validates) and picks its card as `cuda:rank % gpus`, so it wants two.
  #
  # TO PORT to trainDist: rename this key to `epochs` (plural) or it KeyErrors, and add back
  # `val_batch_size` and `epoch_duration`. Two consequences of the single-process trainer are
  # load-bearing for the numbers here:
  #   - NO AUTOCAST. trainer.py has no autocast block, so the reference's `dtype: bfloat16` is a
  #     trainerQuantitative-only key and is deliberately absent. Every memory figure above is fp32.
  #   - Validation runs IN-LINE at the end of each epoch (trainer.py:127), stalling training for its
  #     duration. See epoch_size for what that costs here.
  epoch:                    1000
  # 1,100 steps at bs 12 -> ~0.98 of one pass over the ~13,490-pair train split, so an "epoch" here
  # means roughly what the word usually means. MEASURED at the step times above:
  #
  #   epoch_size   steps   min/epoch (l16)   passes over train   val pass   val overhead
  #        6,600     550               4.2                0.49       8.3s           3.3%
  #       13,200    1100               8.4                0.98       8.3s           1.6%   <- chosen
  #       26,400    2200              16.9                1.96       8.3s           0.8%
  #
  # The val pass is MEASURED, not estimated: forward-only at bs 12, no_grad, 140 ms/step at n_layer 16
  # (85.8 samples/s), so ~710 samples is 8.3 s. It is under 2% of an epoch, so it does not gate the
  # cadence and the tune-train-config balance rule is not the binding consideration — checkpoint
  # cadence is, and ~8 min is a reasonable one.
  #
  # Held IDENTICAL in the l8 sibling even though its epoch is shorter (219 ms/step -> 4.0 min), so both
  # runs advance the same number of samples per epoch and their curves line up on either axis.
  epoch_size:               13200
  # x-axis in cumulative samples, so curves stay comparable across epoch_size / batch_size changes and
  # between this config and its l8 sibling.
  report_step_unit:         examples
  save_mode:                best
  moniter:
    field:                  loss
    mode:                   min


optim:
  # No `lr` here on purpose: the scheduler sets param_group['lr'] every step, so an `lr` in args would
  # be silently overwritten.
  type:                     AdamW
  args:
    betas:                  [0.9, 0.98]
    eps:                    1.e-9
    weight_decay:           0.01
  scheduler:
    type:                   InvSqrt
    args:
      lr_mul:               0.1
      # Peak lr = lr_mul * d_model^-0.5 * n_warmup^-0.5 = 0.1 * 256^-0.5 * 2000^-0.5 = 1.40e-4,
      # identical to the reference run.
      #
      # Unlike the shakedown config, this warmup is also SENSIBLE by the reference's own rule (scale
      # warmup by passes over data): 2,000 steps at bs 12 is 24,000 samples, ~1.8 passes over the train
      # split, and 1.8 epochs at the epoch_size above. On the 85-pair sample the same value was ~415
      # passes, which is why that config had to argue for it.
      n_warmup_steps:       2000
      # Overwritten from model.args.d_model by _copy_fileds below, so it cannot drift from the model.
      # The value here is a placeholder for readability. It matters: a stale 512 would give a peak lr of
      # 9.9e-5 instead of 1.40e-4, 29% low, with nothing raised.
      d_model:              256


# Derived fields, applied before the model is built. The InvSqrt peak lr is
# lr_mul * d_model^-0.5 * n_warmup^-0.5, so the scheduler's d_model must be the model's or the whole lr
# schedule is wrong by a factor of sqrt(ratio) with no error raised.
_copy_fileds:
- [optim.scheduler.args.d_model, model.args.d_model]
