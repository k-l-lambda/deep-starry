# InterleavedSeq2: irregular midiseq2 performance -> Lilylet, interleaved per played measure:
#   <bos>? %style... \n  midi1 <sep> lyl1 <eom>  midi2 <sep> lyl2 <eom> ...
# Only the `lyl <eom>` runs are supervised. Vocabulary/asset handling is as in
# midi-translator-irregular-to-lilylet.yaml (unified 838-row vocab pinned in the run dir).
id:     midi/{date}-{filename}

imports:
  - starry.midi.data.interleavedSeq2
  - starry.midi.models.midiTranslator

# Run-local assets, materialized once at creation and reloaded verbatim on resume. The builder also
# injects the derived model args (vocab_size, eos_id), so they need not be restated below.
assets:
  - type: UnifiedSeq2Vocab

data:
  type:                     InterleavedSeq2
  root:                     test202608
  # 100 paired samples; phase 9 is a small deterministic validation split.
  splits:                   '*0..8/10:9/10'
  batch_size:               4
  args:
    source_format:          midiseq2
    target_format:          lilylet
    source_dir:             midi-seq2-irregular
    target_dir:             lyl
    measures_path:          metadata/measures.json
    # In played MEASURES (units).
    line_range:             [2, 12]
    p_head:                 0.15
    p_tail:                 0.15
    # Over-long crops drop whole units (from the back; from the front on a tail crop).
    max_tokens:             2048
    style_dropout:          0.3
  args_variant:
    1:
      random_crop:          false
      style_dropout:        0

model:
  type:                     MidiTranslator
  # vocab_size (838) and eos_id (2) are injected by the UnifiedSeq2Vocab asset. Stating either here
  # is allowed but redundant — a value disagreeing with the artifact raises rather than being used.
  args:
    backbone:               llama
    d_model:                256
    n_layer:                4
    n_head:                 8
    d_inner:                1024
    num_key_value_heads:    ~
    max_seq_len:            2048
    dropout:                0.1
    tie_embedding:          false

trainer:
  device:                   cuda
  epoch:                    100
  epoch_size:               400
  report_step_unit:         examples
  save_mode:                best
  moniter:
    field:                  loss
    mode:                   min

optim:
  type:                     AdamW
  args:
    betas:                  [0.9, 0.98]
    eps:                    1.e-9
    weight_decay:           0.01
  scheduler:
    type:                   InvSqrt
    args:
      lr_mul:               0.1
      n_warmup_steps:       400
      d_model:               256
