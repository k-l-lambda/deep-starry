# Conditioned-MIDI bGPT — lilylet-conditioned MIDI generation, NotaGenX-opus corpus (nota20260701).
# Same CondMidiPatchy joint sequence + windowed/block measure coupling as midi-measurewise.yaml,
# but on a real training-scale corpus (~14K samples from 4 NotaGenX-opus subdirs) with EXPANDED
# repeats: MuseScore unrolls repeated sections, and each played midi measure is mapped back to its
# lilylet source measure via the lilylet [measures] code, so a repeated section's midi measures
# point at the same lilylet measures (source_measure repeats). Samples whose expanded played
# length disagreed with the MIDI measure count were filtered out during the build.
#
# Data root: on jiuzhang-m.51 at /data1/datasets/nota/midi-measurewise/nota20260701/cond-midi.lmmw.pt
# (relative to DATA_DIR). Single shard, 13957 samples.
#
# NOTE: batch_size / epoch_size are measure-first placeholders (tune-train-config skill). Corpus is
# NOT cropped (per-song measure coupling forbids it); long songs dominate memory.

id:     midi/{date}-{filename}


imports:
  - starry.midi.models.condBgpt
  - starry.midi.data.condPatchy


data:
  type:                     CondMidiPatchy
  root:                     nota/midi-measurewise/nota20260701/cond-midi.lmmw.pt
  # 13957 samples, single shard. cycle 50, phase 49 -> ~279 val / ~13678 train.
  splits:                   '*0..48/50:49/50'
  batch_size:               1
  args_variant: ~
  args:
    patch_size:             16
    patch_length:           0          # 0 = no crop (measure coupling must stay intact)
    w_midi:                 2          # midi->midi attention window, in MEASURES
    w_cross:                2          # midi->lilylet cross window, in MEASURES


model:
  type:                     CondMidiBGPT
  args:
    base_type:              llama
    lyl_vocab_size:         256
    midi_vocab_size:        41
    patch_size:             16
    patch_length:           466000     # >= max T over the corpus (465840); RoPE bound. NOTE: this
                                       # is a lone outlier (mean T≈9948); the long tail dominates
                                       # memory since the corpus is not cropped — consider dropping
                                       # a handful of >~100k-patch songs before a long run.
    hidden_size:            768
    patch_num_layers:       12
    token_num_layers:       3
    n_head:                 12
    num_key_value_heads:    12
    intermediate_size:      3072


trainer:
  env: ~
  device:                   cuda
  save_mode:                best
  epochs:                   10000
  epoch_size:               13678      # placeholder: ~one pass over train; measure & balance
  report_step_unit:         examples
  epoch_duration:           30
  moniter:
    field:                  loss
    mode:                   min
  dtype:                    bf16

optim:
  type:                     Adam
  args:
    betas:                  [0.9, 0.98]
    eps:                    1.e-9
  scheduler:
    type:                   InvSqrt
    args:
      lr_mul:               0.2
      n_warmup_steps:       1000
      d_model:              768
