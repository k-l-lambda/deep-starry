id: lilylet/{date}-{filename}

env: ~

data:
  type: LilyletPatchy
  root: lilylet/notagenx-from-abc.lilylet-notagen.pt
  splits: '*0..8/10:9/10'
  batch_size: 2
  args_variant: ~
  args:
    patch_size: 16
    patch_length: 2048
    patch_stream: true
    tokenizer_path: /home/camus/work/lilylet/tests/output/bpe-tokenizer/manual-tokenizer.json
    preprocess:
      source_dir: /home/camus/work/lilylet/tests/output/notagenx-from-abc
      output: lilylet/notagenx-from-abc.lilylet-notagen.pt
