<!--
Beam-search inspector for midiseq2 translation.

Input: the JSON written by `tools/midi/translateMidiseq2Beam.py --inspect [N]`. Drop it on the page;
nothing is uploaded and there is no server -- the file is read locally with FileReader.

Two linked views, because the question this is built for spans both:

  TREE     one column per decode position, one row per pool rank. Kept candidates are solid and
           joined to their parent; CUT candidates are hollow -- they are the point of the whole
           recording, since a tree of survivors shows the path taken and nothing about the paths
           that were available.
  ONSETS   the align_match_viz geometry: source lane above, generated lane below, a link per
           matched note. The WINNING path is the base map. Selecting a node greys out everything
           the winner produced after that position ("we are here; the rest is not decided yet"),
           and draws the selected candidate itself -- a vertical rule at its tick for an elapse, a
           highlighted onset for a pitch.

Colours follow align_match_viz so the two read as the same instrument: source #2f5f9f, generated
#a5432f, matched #1f7a4d, miss #d81f1f (that green/red pair was checked for protan/deutan
separation, dE 11.5 / 10.8 OKLab x100, so it survives the common dichromacies).
-->
<meta charset="utf-8">
<title>Beam Tree Inspector</title>
<style>
	:root {
		--src: #2f5f9f; --out: #a5432f; --match: #1f7a4d; --miss: #d81f1f;
		--ink: #1c1c1e; --ink2: #5c5c62; --mute: #9a9aa2;
		--line: #e2e2e6; --bg: #fbfbfc; --panel: #fff;
	}
	* { box-sizing: border-box; }
	body { margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		color: var(--ink); background: var(--bg); }
	header { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
		display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
	h1 { font-size: 14px; font-weight: 600; margin: 0; }
	#meta { color: var(--ink2); font-size: 12px; }
	#meta b { font-weight: 600; color: var(--ink); }
	.wrap { padding: 12px 16px 40px; }
	.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
		margin-bottom: 12px; }
	.phead { padding: 7px 12px; border-bottom: 1px solid var(--line); display: flex;
		align-items: center; gap: 12px; flex-wrap: wrap; }
	.ptitle { font-weight: 600; font-size: 12px; }
	.hint { color: var(--mute); font-size: 11px; }
	.scroll { overflow-x: auto; }
	#drop { margin: 40px auto; max-width: 640px; padding: 44px 24px; text-align: center;
		border: 2px dashed #c8c8d0; border-radius: 10px; color: var(--ink2); background: var(--panel); }
	#drop.over { border-color: var(--src); background: #f2f6fc; color: var(--src); }
	#drop code { background: #f0f0f3; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
	#drop input { display: none; }
	#drop label { color: var(--src); text-decoration: underline; cursor: pointer; }
	select, button { font: inherit; padding: 3px 7px; border: 1px solid var(--line);
		border-radius: 4px; background: #fff; color: var(--ink); }
	button:hover { background: #f4f4f7; }
	button:disabled { color: var(--mute); }
	#detail { font-size: 12px; color: var(--ink2); padding: 8px 12px; border-top: 1px solid var(--line);
		font-variant-numeric: tabular-nums; }
	#detail b { color: var(--ink); font-weight: 600; }
	#detail .kv { display: inline-block; margin-right: 18px; }
	.hidden { display: none; }
	svg text { -webkit-user-select: none; user-select: none; }
	.node { cursor: pointer; }
	.legend { display: flex; gap: 14px; align-items: center; font-size: 11px; color: var(--ink2);
		margin-left: auto; }
	.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
		margin-right: 4px; vertical-align: -1px; }
</style>

<header>
	<h1>Beam Tree Inspector</h1>
	<div id="meta"></div>
</header>

<div class="wrap">
	<div id="drop">
		<p style="margin:0 0 8px;font-size:14px">Drop a <b>.beamtree.json</b> here</p>
		<p style="margin:0 0 14px" class="hint">or <label for="file">choose a file</label> — read locally, nothing is uploaded</p>
		<input id="file" type="file" accept=".json,application/json">
		<p style="margin:0" class="hint">produced by <code>translateMidiseq2Beam.py --inspect N</code></p>
	</div>

	<div id="views" class="hidden">
		<div class="panel">
			<div class="phead">
				<span class="ptitle">Search tree</span>
				<label class="hint">window
					<select id="window"></select>
				</label>
				<label class="hint"><input type="checkbox" id="onlyBranch"> only branching positions</label>
				<label class="hint"><input type="checkbox" id="showCut" checked> show cut candidates</label>
				<span class="legend">
					<span><i style="background:var(--match)"></i>kept, on winning path</span>
					<span><i style="background:#8899aa"></i>kept, off path</span>
					<span><i style="background:#fff;border:1px solid var(--mute)"></i>cut</span>
				</span>
			</div>
			<div class="scroll"><svg id="tree"></svg></div>
			<div id="detail">select a node</div>
		</div>

		<div class="panel">
			<div class="phead">
				<span class="ptitle">Onset correspondence</span>
				<label class="hint">x axis
					<select id="unit">
						<option value="tick">tick</option>
						<option value="si">softIndex</option>
					</select>
				</label>
				<span class="hint">both lanes on ONE scale, 40px per <span id="blockLabel">480 ticks</span>; scroll for the rest</span>
				<label class="hint"><input type="checkbox" id="fullSrc"> whole source</label>
				<button id="clearSel" style="margin-left:auto">clear selection</button>
			</div>
			<div class="scroll"><svg id="onsets"></svg></div>
		</div>
	</div>
</div>

<script>
'use strict';

const SVGNS = 'http://www.w3.org/2000/svg';
const C = { src: '#2f5f9f', out: '#a5432f', match: '#1f7a4d', miss: '#d81f1f',
	ink: '#1c1c1e', ink2: '#5c5c62', mute: '#9a9aa2', line: '#e2e2e6' };

let DATA = null, WIN = 0, SEL = null;

function el (name, attrs, parent) {
	const n = document.createElementNS(SVGNS, name);
	for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null)
		n.setAttribute(k, attrs[k]);
	if (parent) parent.appendChild(n);
	return n;
}

// --- loading ---------------------------------------------------------------------------

const drop = document.getElementById('drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => {
	e.preventDefault(); drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => {
	e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e => {
	const f = e.dataTransfer.files[0];
	if (f) read(f);
});
document.getElementById('file').addEventListener('change', e => {
	if (e.target.files[0]) read(e.target.files[0]);
});
// The whole page is a drop target too, so a second file can be dropped without scrolling back up.
['dragover', 'drop'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener('drop', e => {
	if (e.target.closest('#drop')) return;
	const f = e.dataTransfer && e.dataTransfer.files[0];
	if (f) read(f);
});

function read (file) {
	const r = new FileReader();
	r.onload = () => {
		let d;
		try { d = JSON.parse(r.result); }
		catch (err) { alert('Not valid JSON: ' + err.message); return; }
		if (!d.windows || !d.source) { alert('Not a beamtree dump: expected {meta, windows, source}'); return; }
		load(d, file.name);
	};
	r.readAsText(file);
}

function load (d, name) {
	DATA = d; WIN = 0; SEL = null;
	const m = d.meta || {};
	document.getElementById('meta').innerHTML =
		`<b>${esc(name)}</b> — beam <b>${m.beam}</b>, branch-k <b>${m.branch_k}</b>, ` +
		`length-alpha ${m.length_alpha}, rank ${m.rank ?? 'lm'} · ` +
		`<b>${m.positions}</b> positions, <b>${m.nodes}</b> nodes, ${m.windows} window(s)` +
		(m.truncated ? ' <span style="color:' + C.miss + '">(recording truncated)</span>' : '') +
		`<br>${esc(m.run || '')} · ${esc(m.checkpoint || '')} · src_window ${m.src_window}` +
		`, advance ${m.advance_tokens} · input ${esc(m.input || '')}`;
	const sel = document.getElementById('window');
	sel.innerHTML = '';
	d.windows.forEach((w, i) => {
		const o = document.createElement('option');
		o.value = i;
		o.textContent = `${i} — ${w.positions.length} positions`;
		sel.appendChild(o);
	});
	drop.classList.add('hidden');
	document.getElementById('views').classList.remove('hidden');
	render();
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('window').addEventListener('change', e => {
	WIN = +e.target.value; SEL = null; render();
});
document.getElementById('onlyBranch').addEventListener('change', render);
document.getElementById('showCut').addEventListener('change', render);
document.getElementById('clearSel').addEventListener('click', () => { SEL = null; render(); });
document.getElementById('fullSrc').addEventListener('change', renderOnsets);
document.getElementById('unit').addEventListener('change', () => {
	document.getElementById('blockLabel').textContent =
		unit() === 'tick' ? '480 ticks' : '1 softIndex';
	renderOnsets();
});

const unit = () => document.getElementById('unit').value;

/* One block of x. 480 ticks is a beat at the corpus's ticks_per_beat, and 1 softIndex is one
   saturated interval -- so a block is a musically meaningful unit in either mode, which is what
   makes a fixed px-per-block honest rather than arbitrary. */
const BLOCK = () => (unit() === 'tick' ? 480 : 1);
const PX_PER_BLOCK = 40;

/* Where a thing sits on the x axis, in the current unit.

   In softIndex mode an elapse uses the PROVISIONAL si the dump records: softIndex only advances
   when a note happens, so an elapse has none of its own -- what it has is where the next note would
   land if it happened at the new tick. For a pitch candidate that provisional value equals its
   align.softIndex by construction, so the two modes stay consistent with each other. */
const posOfCand = c => (unit() === 'tick' ? c.tick : c.si);
const posOfNote = a => (unit() === 'tick' ? a.onset : a.softIndex);
const posOfSrc = e => (unit() === 'tick' ? e.onset : e.softIndex);

// --- model ----------------------------------------------------------------------------

function win () { return DATA.windows[WIN]; }

/* The winning path: walk PARENT links back from the window's reported winner.
   Derived from best_uid rather than from "the top-ranked kept node at each position", because those
   are not the same path -- the winner is chosen once at the end, and a rank-0 node can belong to a
   lineage that was later dropped. */
function winningPath () {
	const w = win();
	const byUid = new Map();
	for (const pos of w.positions)
		for (const c of pos.candidates) if (c.uid !== null) byUid.set(c.uid, c);
	const chain = [];
	let uid = w.best_uid;
	while (uid != null && byUid.has(uid)) {
		const c = byUid.get(uid);
		chain.push(c);
		uid = c.parent;
	}
	chain.reverse();
	return chain;
}

/* Ancestors of a node, nearest-last, so a selection can be located on (or off) the winning path. */
function ancestry (node) {
	const w = win();
	const byUid = new Map();
	// carry the position onto each entry: a candidate object does not know its own, and a caller that
	// wants to NAME an ancestor (rather than only walk past it) needs it
	for (const pos of w.positions)
		for (const c of pos.candidates)
			if (c.uid !== null) byUid.set(c.uid, { ...c, position: pos.position });
	const chain = [];
	let uid = node.parent;
	while (uid != null && byUid.has(uid)) {
		const c = byUid.get(uid);
		chain.push(c);
		uid = c.parent;
	}
	chain.reverse();
	return chain;
}

/* Notes the winning path produced: one per candidate that closed a note_on, in emission order. */
function pathNotes (chain) {
	const out = [];
	chain.forEach((c, i) => {
		if (c.align) out.push({ cand: c, depth: i, align: c.align });
	});
	return out;
}

function visiblePositions () {
	const w = win();
	const onlyBranch = document.getElementById('onlyBranch').checked;
	return w.positions.filter(p => !onlyBranch || p.candidates.length > p.live.length);
}

// --- tree view ------------------------------------------------------------------------

function render () { renderTree(); renderOnsets(); renderDetail(); }

function renderTree () {
	const svg = document.getElementById('tree');
	svg.innerHTML = '';
	const positions = visiblePositions();
	const showCut = document.getElementById('showCut').checked;
	const path = winningPath();
	const onPath = new Set(path.map(c => c.uid));

	const COLW = 74, ROWH = 19, PADL = 52, PADT = 26, PADB = 14;
	const maxRows = Math.max(1, ...positions.map(p =>
		showCut ? p.candidates.length : p.candidates.filter(c => c.kept).length));
	const W = PADL + Math.max(1, positions.length) * COLW + 20;
	const H = PADT + maxRows * ROWH + PADB;
	svg.setAttribute('width', W); svg.setAttribute('height', H);
	svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

	// The selection's PARENT, so the node the selected candidate branched off is identifiable at a
	// glance. A cut candidate has uid null, so the parent is addressed by uid (which every PARENT
	// has by construction -- it was kept) rather than by the (position, rank) rule sameNode uses.
	const selParent = SEL ? SEL.parent : null;

	// where each uid was drawn, so an edge can be joined to its parent
	const at = new Map();
	const cols = positions.map((pos, ci) => {
		const rows = (showCut ? pos.candidates : pos.candidates.filter(c => c.kept));
		rows.forEach((c, ri) => {
			const x = PADL + ci * COLW, y = PADT + ri * ROWH;
			if (c.uid !== null) at.set(c.uid, { x, y, ci });
		});
		return { pos, rows, ci };
	});

	// edges first, so nodes sit on top of them
	for (const { rows, ci } of cols) {
		rows.forEach((c, ri) => {
			const p = at.get(c.parent);
			if (!p) return;
			const x = PADL + ci * COLW, y = PADT + ri * ROWH;
			const live = c.kept && onPath.has(c.uid);
			const isSelEdge = SEL && sameNode(SEL, c, cols[ci].pos);
			el('path', {
				d: `M${p.x + 46},${p.y + 6.5} C${p.x + 60},${p.y + 6.5} ${x - 14},${y + 6.5} ${x},${y + 6.5}`,
				fill: 'none',
				stroke: isSelEdge ? C.out : (live ? C.match : (c.kept ? '#8899aa' : C.line)),
				'stroke-width': isSelEdge ? 2 : (live ? 1.6 : 1),
				opacity: isSelEdge ? 1 : (c.kept ? 0.85 : 0.5),
			}, svg);
		});
	}

	for (const { pos, rows, ci } of cols) {
		const x = PADL + ci * COLW;
		el('text', { x: x + 23, y: 15, 'text-anchor': 'middle', 'font-size': 10,
			fill: C.mute }, svg).textContent = pos.position;
		rows.forEach((c, ri) => {
			const y = PADT + ri * ROWH;
			const live = c.kept && onPath.has(c.uid);
			const g = el('g', { class: 'node' }, svg);
			const isSel = SEL && sameNode(SEL, c, pos);
			// The parent is outlined dashed rather than solid so it reads as context, not as a second
			// selection. `selParent != null` guards the root, whose parent uid is null -- without it
			// every cut candidate (uid null) would match and the whole column would light up.
			const isSelParent = !isSel && selParent != null && c.uid === selParent;
			g.appendChild(el('rect', {
				x, y, width: 46, height: 13, rx: 2.5,
				fill: live ? C.match : (c.kept ? '#8899aa' : '#fff'),
				stroke: isSel || isSelParent ? C.out : (c.kept ? 'none' : C.mute),
				'stroke-width': isSel ? 2 : (isSelParent ? 1.6 : 1),
				'stroke-dasharray': isSelParent ? '3 2' : null,
				opacity: c.kept ? 1 : 0.75,
			}));
			g.appendChild(el('text', {
				x: x + 23, y: y + 9.7, 'text-anchor': 'middle', 'font-size': 9.5,
				fill: c.kept ? '#fff' : C.ink2,
				'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace',
			})).textContent = c.token.length > 8 ? c.token.slice(0, 7) + '…' : c.token;
			// an alignment verdict, when this node closed a note: a dot on the left edge
			if (c.align) g.appendChild(el('circle', {
				cx: x - 4, cy: y + 6.5, r: 2.6,
				fill: c.align.src === null ? C.miss : C.match,
			}));
			g.addEventListener('click', () => {
				SEL = { ...c, position: pos.position };
				render();
			});
			g.appendChild(el('title', {})).textContent =
				`${c.token}  rank ${c.rank}  logp ${c.logprob}  cum ${c.cum}` +
				(c.align ? `\nalign: ${c.align.src === null ? 'MISS' :
					'src #' + c.align.src + ' @' + c.align.src_onset} self_cost ${c.align.self_cost}` : '');
		});
	}
	el('text', { x: 6, y: PADT + 9, 'font-size': 10, fill: C.mute }, svg).textContent = 'rank 0';
	if (!positions.length)
		el('text', { x: PADL, y: PADT + 10, 'font-size': 12, fill: C.mute }, svg)
			.textContent = 'no positions match the filter';
}

function sameNode (a, b, pos) {
	return a.position === pos.position && a.rank === b.rank;
}

// --- onset view -----------------------------------------------------------------------

function renderOnsets () {
	const svg = document.getElementById('onsets');
	svg.innerHTML = '';
	const path = winningPath();
	const notes = pathNotes(path);
	const src = DATA.source;
	const U = unit(), blk = BLOCK();

	// The selection is a cursor along the winning path: everything the winner produced at a LATER
	// depth is greyed, which is what makes the view read as "we are here, the rest is open".
	const cursor = (SEL && SEL.uid !== null) ? path.findIndex(c => c.uid === SEL.uid) : -1;
	const selDepth = SEL ? (cursor >= 0 ? cursor : ancestry(SEL).length) : Infinity;
	const matchedSrc = new Set(notes.filter(n => n.depth <= selDepth && n.align.src !== null)
		.map(n => n.align.src));

	const PADL = 54, PADR = 20, PADT = 22, LANE = 104, GAP = 66, AXIS = 30;
	const H = PADT + LANE * 2 + GAP + AXIS;

	/* ONE scale for both lanes, over the union of what either arm reaches. Not the per-lane
	   normalisation align_match_viz uses: there, each lane spanning its own extent is what keeps the
	   alignment's conclusion out of the geometry, but it also means the two x axes are not
	   comparable. Sharing the scale makes drift directly visible -- if the generated arm runs fast,
	   its notes crowd left of the source notes they matched and every link tilts the same way -- at
	   the cost of the generated arm occupying only part of the width when the source is longer.
	   That is what the scroll bar is for. */
	const srcPos = src.map(posOfSrc);
	const outPos = notes.map(n => posOfNote(n.align));
	const selPos = [];
	if (SEL) {
		const p = posOfCand(SEL);
		if (p !== undefined && p !== null) selPos.push(p);
		if (SEL.align) selPos.push(posOfNote(SEL.align));
	}
	/* By default the range is what the GENERATED arm reaches, padded -- not the union with the whole
	   source. A window-scoped dump has a source spanning the entire file and a generated arm covering
	   its first few bars (9% of it on the run this was built against), so the union would leave the
	   generated lane a sliver at the far left of a canvas that is 90% empty. Matched source positions
	   are folded in so a link never points off-screen, and `whole source` restores the union for when
	   the question is where in the file this window sits. */
	const full = document.getElementById('fullSrc').checked;
	const matchedPos = notes.filter(n => n.align.src !== null).map(n => posOfSrc(src[n.align.src]));
	const focus = outPos.concat(matchedPos, selPos);
	const all = (full || !focus.length) ? srcPos.concat(outPos, selPos) : focus;
	let lo = all.length ? Math.min(...all) : 0, hi = all.length ? Math.max(...all) : blk;
	if (!full && focus.length) {
		const padv = Math.max(blk * 2, (hi - lo) * 0.08);
		lo -= padv; hi += padv;
	}
	// snap outward to block boundaries so a gridline lands on a round number
	lo = Math.floor(lo / blk) * blk;
	hi = Math.ceil(hi / blk) * blk;
	if (hi <= lo) hi = lo + blk;
	const blocks = Math.round((hi - lo) / blk);
	// A fixed px per block, so a distance on screen means the same thing everywhere and between
	// files. The width follows from the span; when it exceeds the viewport the container scrolls.
	const spanW = Math.max(blocks * PX_PER_BLOCK, 320);
	const W = PADL + spanW + PADR;
	svg.setAttribute('width', W); svg.setAttribute('height', H);
	svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

	const x = v => PADL + ((v - lo) / (hi - lo)) * spanW;

	const pitches = src.filter(e => { const q = posOfSrc(e); return q >= lo && q <= hi; })
		.map(e => e.pitch).concat(notes.map(n => n.align.pitch));
	const ext = a => a.length ? [Math.min(...a), Math.max(...a)] : [60, 61];
	const [pLo, pHi] = ext(pitches);
	const pad = Math.max(2, (pHi - pLo) * 0.08);
	const yOf = (p, top) => top + LANE - (p - pLo + pad) / (pHi - pLo + pad * 2) * LANE;
	const topS = PADT, topO = PADT + LANE + GAP;

	// gridlines through BOTH lanes: shared scale means one vertical is the same instant in each
	const labelEvery = Math.max(1, Math.ceil(60 / PX_PER_BLOCK));
	for (let b = 0; b <= blocks; b++) {
		const v = lo + b * blk, gx = x(v);
		el('line', { x1: gx, y1: topS, x2: gx, y2: topO + LANE,
			stroke: b % labelEvery === 0 ? '#e8e8ec' : '#f4f4f7', 'stroke-width': 1 }, svg);
		if (b % labelEvery === 0)
			el('text', { x: gx, y: topO + LANE + 16, 'text-anchor': 'middle', 'font-size': 9.5,
				fill: C.mute, 'font-variant-numeric': 'tabular-nums' }, svg)
				.textContent = U === 'tick' ? v : v.toFixed(0);
	}
	el('text', { x: PADL, y: topO + LANE + 27, 'font-size': 9.5, fill: C.mute }, svg)
		.textContent = U === 'tick'
			? `tick (${lo}..${hi}, ${blocks} beats at 480/beat, ${PX_PER_BLOCK}px each)`
			: `softIndex (${lo}..${hi}, ${PX_PER_BLOCK}px per unit) — tanh(interval/`
				+ `${(DATA.meta && DATA.meta.simultaneous_ticks) || 115}) per step, so a chord is one position`;

	for (const [top, label, col] of [[topS, 'source', C.src], [topO, 'generated', C.out]]) {
		el('rect', { x: PADL, y: top, width: spanW, height: LANE, fill: 'none',
			stroke: col, 'stroke-width': 0.7, opacity: 0.5 }, svg);
		el('text', { x: 6, y: top + 11, 'font-size': 10, fill: col }, svg).textContent = label;
	}

	// links before the marks, so a dot always sits on top of its own line
	notes.forEach(n => {
		if (n.align.src === null) return;
		const dim = n.depth > selDepth;
		const sp = posOfSrc(src[n.align.src]);
		el('line', { x1: x(sp), y1: yOf(n.align.src_pitch, topS),
			x2: x(posOfNote(n.align)), y2: yOf(n.align.pitch, topO),
			stroke: dim ? '#d8d8dc' : C.match, 'stroke-width': dim ? 0.5 : 0.9, opacity: 0.5 }, svg);
	});

	let offscreen = 0;
	src.forEach((e, i) => {
		const sp = posOfSrc(e);
		if (sp < lo || sp > hi) { offscreen++; return; }
		const hit = matchedSrc.has(i);
		el('circle', { cx: x(sp), cy: yOf(e.pitch, topS), r: hit ? 3 : 2.1,
			fill: hit ? C.src : 'none', stroke: C.src, 'stroke-width': 0.7,
			opacity: hit ? 0.95 : 0.4 }, svg);
	});

	notes.forEach(n => {
		const dim = n.depth > selDepth;
		const miss = n.align.src === null;
		el('circle', { cx: x(posOfNote(n.align)), cy: yOf(n.align.pitch, topO),
			r: dim ? 2 : 3, fill: dim ? '#e4e4e8' : (miss ? C.miss : C.match),
			stroke: dim ? '#cfcfd6' : 'none', 'stroke-width': 0.7 }, svg);
	});

	let focusX = null;
	if (SEL) {
		const isElapse = /^E[0-9a-f]+$/i.test(SEL.token);
		if (isElapse) {
			// An elapse decides WHEN, so it has an x and no pitch: a rule at the position it moves the
			// clock to.
			const gx = x(posOfCand(SEL));
			focusX = gx;
			el('line', { x1: gx, y1: topO - 10, x2: gx, y2: topO + LANE + 8,
				stroke: C.out, 'stroke-width': 1.6, 'stroke-dasharray': '4 3' }, svg);
			el('text', { x: gx + 4, y: topO - 14, 'font-size': 10, fill: C.out,
				'font-family': 'ui-monospace, Menlo, monospace' }, svg)
				.textContent = `${SEL.token} → ${U === 'tick' ? 'tick ' + SEL.tick : 'si ' + SEL.si}`;
		} else if (SEL.align) {
			const gx = x(posOfNote(SEL.align)), gy = yOf(SEL.align.pitch, topO);
			focusX = gx;
			el('circle', { cx: gx, cy: gy, r: 6.5, fill: 'none', stroke: C.out, 'stroke-width': 2 }, svg);
			el('circle', { cx: gx, cy: gy, r: 3,
				fill: SEL.align.src === null ? C.miss : C.match }, svg);
			if (SEL.align.src !== null) {
				const sx = x(posOfSrc(src[SEL.align.src])), sy = yOf(SEL.align.src_pitch, topS);
				el('circle', { cx: sx, cy: sy, r: 6.5, fill: 'none', stroke: C.out,
					'stroke-width': 2 }, svg);
				el('line', { x1: sx, y1: sy, x2: gx, y2: gy, stroke: C.out, 'stroke-width': 1.8 }, svg);
			}
			el('text', { x: gx + 9, y: gy - 8, 'font-size': 10, fill: C.out,
				'font-family': 'ui-monospace, Menlo, monospace' }, svg)
				.textContent = `${SEL.token}${SEL.align.src === null ? ' (miss)' : ''}`;
		} else {
			// nothing for the alignment to judge (velocity, channel, keyword): mark the clock it
			// inherits, so the selection is still locatable
			const gx = x(posOfCand(SEL));
			focusX = gx;
			el('line', { x1: gx, y1: topO + LANE - 7, x2: gx, y2: topO + LANE + 7,
				stroke: C.mute, 'stroke-width': 1.4 }, svg);
			el('text', { x: gx + 4, y: topO + LANE + 27, 'font-size': 10, fill: C.mute,
				'font-family': 'ui-monospace, Menlo, monospace' }, svg)
				.textContent = `${SEL.token} (no onset)`;
		}
	}

	el('text', { x: PADL + spanW, y: topS - 8, 'text-anchor': 'end', 'font-size': 10,
		fill: C.ink2 }, svg).textContent =
		`${src.length - offscreen}/${src.length} source note_on shown · ${notes.length} on the winning path`
		+ (offscreen ? ` · ${offscreen} source outside this range` : '')
		+ (SEL ? ` · ${notes.filter(n => n.depth > selDepth).length} greyed after the selection` : '');

	// Bring the selection into view rather than leaving it off-screen on a scrolled canvas: a click
	// in the tree that appears to do nothing is indistinguishable from a bug.
	if (focusX !== null) {
		const box = svg.parentElement;
		const want = focusX - box.clientWidth / 2;
		if (focusX < box.scrollLeft + 40 || focusX > box.scrollLeft + box.clientWidth - 40)
			box.scrollLeft = Math.max(0, want);
	}
}

// --- detail ---------------------------------------------------------------------------

function renderDetail () {
	const d = document.getElementById('detail');
	if (!SEL) { d.textContent = 'select a node'; return; }
	const kv = (k, v) => `<span class="kv">${k} <b>${v}</b></span>`;
	const a = SEL.align;
	const path = winningPath();
	const onWinner = SEL.uid !== null && path.some(c => c.uid === SEL.uid);
	// Name the parent explicitly: the pool is sorted over ALL beams, so which hypothesis a candidate
	// hangs off is what decides whether it survived on its own merit or on its lineage's lead.
	const anc = ancestry(SEL);
	const par = anc.length ? anc[anc.length - 1] : null;
	let html = kv('position', SEL.position) + kv('token', esc(SEL.token)) + kv('pool rank', SEL.rank)
		+ kv('parent', par ? `${esc(par.token)} @${par.position} (cum ${par.cum})` : 'root')
		+ kv('logp', SEL.logprob) + kv('cum logp', SEL.cum)
		+ kv('status', SEL.kept ? (onWinner ? 'kept, on winning path' : 'kept, later dropped')
			: (SEL.eos ? 'terminator' : 'CUT'))
		+ kv('tick', SEL.tick);
	if (a) {
		html += '<br>' + kv('align', a.src === null ? 'MISS' : `source #${a.src}`)
			+ kv('self_cost', a.self_cost) + kv('running cost', a.cost)
			+ kv('offset', a.offset === null ? '—' : a.offset) + kv('skip', a.skip)
			+ kv('pitch', '0x' + Number(a.pitch).toString(16))
			+ (a.src === null ? '' : kv('source onset', a.src_onset));
	} else {
		html += '<br><span class="hint">this token closed no note_on, so the alignment has nothing to score at it</span>';
	}
	d.innerHTML = html;
}
</script>
